<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Propositions d'amélioration - HGO</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: white;
            color: #333;
        }

        header {
            background-color: #c40000;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
        }

        nav {
            background-color: white;
            text-align: center;
            padding: 15px;
            border-bottom: 3px solid #c40000;
        }

        nav a {
            color: #c40000;
            text-decoration: none;
            font-weight: bold;
            margin: 0 15px;
        }

        main {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 25px;
        }

        h2 {
            color: #c40000;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 20px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        textarea {
            height: 150px;
            resize: vertical;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            background-color: #c40000;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #990000;
        }

        footer {
            margin-top: 50px;
            background-color: #c40000;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>HGO - Propositions d'amélioration</h1>
    </header>

    <nav>
        <a href="index.html">Accueil</a>
        <a href="personnel.html">Le personnel</a>
        <a href="clinique.html">La clinique</a>
        <a href="propositions.html">Propositions</a>
    </nav>

    <main>

        <h2>Votre avis nous intéresse !</h2>

        <p>
            Vous avez une idée pour améliorer notre site ou notre projet ?
            Écrivez-nous votre proposition ci-dessous.
        </p>

        <form action="https://formspree.io/f/xnpjnbzz" method="post">

            <label for="nom">Votre prénom :</label>
            <input type="text" id="nom" name="nom" placeholder="Votre prénom">

            <label for="message">Votre proposition :</label>
            <textarea id="message" name="message"
                placeholder="Écrivez votre proposition ici..."></textarea>

            <button type="submit">Envoyer ma proposition</button>

        </form>

    </main>

    <footer>
        Projet scolaire fictif - HGO
    </footer>

</body>

</html>
